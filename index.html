<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business E-Payment Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: #f5f7fb;
  color: #333;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
}

.container {
  width: 95%;
  max-width: 1000px;
  background: #fff;
  border-radius: 10px;
  padding: 25px;
  margin: 20px auto;
  box-shadow: 0 3px 12px rgba(0,0,0,0.1);
}

header {
  text-align: center;
  font-weight: 700;
  font-size: 1.5em;
  color: #0078ff;
  margin-bottom: 20px;
}

label {
  display: block;
  font-weight: 600;
  margin-top: 10px;
}

input, select {
  width: 100%;
  padding: 8px;
  margin-top: 5px;
  border-radius: 5px;
  border: 1px solid #ccc;
  font-size: 1em;
  box-sizing: border-box;
}

button {
  margin-top: 15px;
  background: #0078ff;
  color: white;
  border: none;
  border-radius: 6px;
  padding: 10px 15px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s;
}

button:hover { background: #005fcc; }

.flex {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
}

.table-container {
  overflow-x: auto;
  overflow-y: auto;
  max-height: 420px;
  margin-top: 20px;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.9em;
  min-width: 600px;
  text-align: center;
}

th, td {
  border: 1px solid #ddd;
  padding: 8px;
}

th {
  background: #0078ff;
  color: white;
}

tfoot td {
  font-weight: bold;
  background: #f1f1f1;
}

.delete-btn {
  background: #ff4d4d;
  color: white;
  border: none;
  border-radius: 4px;
  padding: 5px 10px;
  cursor: pointer;
  font-size: 0.8em;
}

.delete-btn:hover {
  background: #e60000;
}

/* Section Styles */
.form-section, .summary-section {
  background: #f8f9fa;
  border-radius: 8px;
  padding: 20px;
  margin-bottom: 20px;
}

/* Page visibility */
.page {
  display: none;
}

.page.active {
  display: block;
}

/* Focus */
input:focus, select:focus {
  outline: 2px solid #0078ff;
  outline-offset: 2px;
}
</style>
</head>

<body>
<div class="container">
  <!-- FORM PAGE -->
  <div id="formPage" class="page active">
    <header>💼 BUSINESS E-PAYMENT TRACKER</header>

    <div class="form-section">
      <label>📅 Date:</label>
      <input type="date" id="date">

      <label>💳 Transaction Type:</label>
      <select id="transaction" onchange="updateSubCategory()">
        <option value="">Select Transaction</option>
        <option value="GCASH">GCASH</option>
        <option value="LOAD">LOAD</option>
        <option value="BILLS">BILLS PAYMENT</option>
      </select>

      <div id="subCategoryContainer" style="display:none;">
        <label>📱 Category:</label>
        <select id="subCategory"></select>
      </div>

      <label>💰 Amount:</label>
      <input type="number" id="amount" placeholder="Enter Amount">

      <label>💸 Fee:</label>
      <input type="number" id="fee" placeholder="Enter Fee">

      <button onclick="addRecord()">➕ Add Transaction</button>
      <button onclick="showSummary()">📊 Generate Summary</button>
    </div>
  </div>

  <!-- SUMMARY PAGE -->
  <div id="summaryPage" class="page">
    <div class="summary-section">
      <header>📊 BUSINESS E-PAYMENT SUMMARY</header>

      <div class="flex">
        <div>
          <label>📅 Filter by Month:</label>
          <input type="month" id="monthFilter" onchange="renderTable()">
        </div>
        <div>
          <button onclick="showForm()">⬅ Back</button>
          <button onclick="exportToText()">📝 Export to Text</button>
        </div>
      </div>

      <div class="table-container">
        <table id="summaryTable">
          <thead>
            <tr>
              <th>DATE</th>
              <th>TRANSACTION</th>
              <th>CATEGORY</th>
              <th>AMOUNT (₱)</th>
              <th>FEE (₱)</th>
              <th>TOTAL (₱)</th>
              <th>INCOME (₱)</th>
              <th>ACTION</th>
            </tr>
          </thead>
          <tbody></tbody>
          <tfoot>
            <tr>
              <td colspan="6" class="total-label">TOTAL INCOME:</td>
              <td class="total-value" id="totalIncomeCell">₱0.00</td>
              <td></td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
let records = JSON.parse(localStorage.getItem("businessRecords")) || [];

function saveRecords() {
  localStorage.setItem("businessRecords", JSON.stringify(records));
}

function updateSubCategory() {
  const transaction = document.getElementById("transaction").value;
  const subCat = document.getElementById("subCategory");
  const container = document.getElementById("subCategoryContainer");
  subCat.innerHTML = "";
  container.style.display = "none";

  let options = [];
  if (transaction === "LOAD") options = ["SMART", "GLOBE", "TNT", "TM"];
  if (transaction === "BILLS") options = ["POWER", "WATER", "INTERNET"];
  if (transaction === "GCASH") options = ["Cash In", "Cash Out"];

  if (options.length > 0) {
    container.style.display = "block";
    options.forEach(opt => {
      const o = document.createElement("option");
      o.value = opt; 
      o.textContent = opt;
      subCat.appendChild(o);
    });
  }
}

function addRecord() {
  const date = document.getElementById("date").value;
  const transaction = document.getElementById("transaction").value;
  const subCategory = document.getElementById("subCategory").value || "";
  const amount = parseFloat(document.getElementById("amount").value);
  const fee = parseFloat(document.getElementById("fee").value);

  if (!date || !transaction || isNaN(amount) || isNaN(fee)) {
    alert("Please complete all fields!");
    return;
  }

  const total = amount + fee;
  const income = fee;
  records.push({ date, transaction, subCategory, amount, fee, total, income });
  saveRecords();
  renderTable();

  // Clear inputs
  document.getElementById("date").value = "";
  document.getElementById("transaction").value = "";
  document.getElementById("amount").value = "";
  document.getElementById("fee").value = "";
  document.getElementById("subCategoryContainer").style.display = "none";
}

function deleteRecord(index) {
  if (confirm("Are you sure you want to delete this record?")) {
    records.splice(index, 1);
    saveRecords();
    renderTable();
  }
}

function renderTable() {
  const tbody = document.querySelector("#summaryTable tbody");
  tbody.innerHTML = "";
  const month = document.getElementById("monthFilter").value;
  let filtered = records;
  if (month) filtered = records.filter(r => r.date.startsWith(month));

  let totalIncome = 0;
  filtered.forEach((r, index) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${r.date}</td>
      <td>${r.transaction}</td>
      <td>${r.subCategory || "-"}</td>
      <td>₱${r.amount.toFixed(2)}</td>
      <td>₱${r.fee.toFixed(2)}</td>
      <td>₱${r.total.toFixed(2)}</td>
      <td>₱${r.income.toFixed(2)}</td>
      <td><button class="delete-btn" onclick="deleteRecord(${index})">Delete</button></td>`;
    tbody.appendChild(tr);
    totalIncome += r.income;
  });

  document.getElementById("totalIncomeCell").textContent = "₱" + totalIncome.toFixed(2);
}

function showForm() {
  document.getElementById("formPage").classList.add("active");
  document.getElementById("summaryPage").classList.remove("active");
}

function showSummary() {
  document.getElementById("summaryPage").classList.add("active");
  document.getElementById("formPage").classList.remove("active");
  renderTable();
}

function exportToText() {
  const monthFilter = document.getElementById("monthFilter").value;
  let filtered = records;
  if (monthFilter) {
    filtered = records.filter(r => r.date.startsWith(monthFilter));
  }

  let content = "BUSINESS E-PAYMENT SUMMARY\n";
  content += "=================================\n\n";
  
  if (monthFilter) {
    content += `Period: ${new Date(monthFilter).toLocaleDateString('en-US', { year: 'numeric', month: 'long' })}\n\n`;
  }
  
  content += "TRANSACTIONS:\n-------------\n\n";
  
  let totalIncome = 0;
  filtered.forEach(r => {
    totalIncome += r.income;
    content += `• Date: ${r.date}\n`;
    content += `  Type: ${r.transaction}\n`;
    content += `  Category: ${r.subCategory || "-"}\n`;
    content += `  Fee: ₱${r.fee.toFixed(2)}\n`;
    content += `  Total: ₱${r.total.toFixed(2)}\n`;
    content += `  Income: ₱${r.income.toFixed(2)}\n\n`;
  });
  
  content += "TOTAL INCOME:\n-------------\n";
  content += `₱${totalIncome.toFixed(2)}\n`;
  
  const blob = new Blob([content], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `business_summary_${monthFilter || 'all'}.txt`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

window.onload = () => {
  document.getElementById("date").valueAsDate = new Date();
};
</script>
</body>
</html>
